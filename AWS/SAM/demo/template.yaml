AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Existing API Gateway + Lambda reconstructed as SAM from exported files

Resources:
  HelloApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: HelloApiFunction
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      Environment:
        Variables:
          APP_ENV: dev
          LOG_LEVEL: INFO
          GREETING: Hello from SAM
      Events:
        GetHello:
          Type: Api
          Properties:
            Path: /hello
            Method: get

Outputs:
  ApiUrl:
    Description: API endpoint URL for the Lambda function
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/hello"
